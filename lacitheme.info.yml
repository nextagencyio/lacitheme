name: LACI Theme
description: "LACI theme. Self-contained: builds on Drupal core's stable9 rather than a contributed base theme."
version: 1.4.0
license: AGPL-3.0-or-later
core_version_requirement: ^10 || ^11 || ^12
package: LACI
type: theme
base theme: stable9
dependencies:
  - drupal:simple_block

# Image appears on admin/appearance
# screenshot: images/screenshot.jpg

# Uncomment these lines and change "lacitheme" to your theme name if you
# need to add custom CSS or JS
libraries:
 - lacitheme/global

# Regions are output in the page.html.twig

regions:
  meta_header: 'Meta header'
  header: Header
  help: Help
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  highlighted: Highlighted
  content: Content
  under_content: 'Under Content'
  sidebar_first: 'Left sidebar'
  sidebar_second: 'Right sidebar'
  footer_first: 'Footer first column'
  footer_middle: 'Footer middle column'
  footer_last: 'Footer last column'
  left_off_canvas: 'Left off canvas'
  right_off_canvas: 'Right off canvas'
regions_hidden:
  page_top: 'Page top'
  page_bottom: 'Page bottom'

# Hidden regions
# regions_hidden[]: Page top
# regions_hidden[]: Page bottom

features:
  - slogan
  - favicon
  - comment_user_picture
  - node_user_picture

logo: 'logo.png'
